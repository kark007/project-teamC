<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ヤマト運輸 - デジタル受取確認</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500&display=swap');
        
        .terminal-font {
            font-family: 'Fira Code', monospace;
        }

        .scanline {
            width: 100%;
            height: 100px;
            z-index: 10;
            background: linear-gradient(0deg, rgba(0, 0, 0, 0) 0%, rgba(255, 0, 0, 0.1) 50%, rgba(0, 0, 0, 0) 100%);
            opacity: 0.15;
            position: absolute;
            bottom: 100%;
            animation: scanline 4s linear infinite;
        }

        @keyframes scanline {
            0% { bottom: 100%; }
            100% { bottom: -100px; }
        }

        .pixel-bg {
            background-image: radial-gradient(rgba(239, 68, 68, 0.1) 1px, transparent 0);
            background-size: 20px 20px;
        }
    </style>
</head>
<body class="bg-gray-900 text-white min-h-screen flex flex-col items-center justify-center p-0 sm:p-4 pixel-bg relative overflow-hidden font-sans">
    <div class="scanline"></div>

    <!-- smartphone style container -->
    <div id="viewer" class="w-full h-screen sm:max-w-[390px] sm:h-[844px] sm:rounded-[3rem] bg-gray-50 text-gray-800 shadow-2xl overflow-hidden flex flex-col relative sm:border-[8px] sm:border-black transition-all duration-700">
        
        <!-- smartphone status bar -->
        <div class="bg-yellow-500 text-black px-6 pt-3 pb-2 flex justify-between items-center text-xs font-bold select-none shrink-0">
            <span class="font-mono">14:12</span>
            <div class="flex items-center gap-1.5">
                <!-- icons of radio waves, Wi-Fi, battery -->
                <svg class="w-4 h-4" fill="currentColor" viewBox="0 0 24 24">
                    <path d="M12 3c-4.97 0-9 4.03-9 9 0 2.12.74 4.07 1.97 5.61L4.35 19.4c-.39.39-.39 1.02 0 1.41.39.39 1.02.39 1.41 0l1.9-1.9C9.22 19.58 10.57 20 12 20c4.97 0 9-4.03 9-9s-4.03-9-9-9zm0 15c-3.31 0-6-2.69-6-6s2.69-6 6-6 6 2.69 6 6-2.69 6-6 6z"/>
                </svg>
                <div class="w-5 h-2.5 border border-black rounded-sm p-0.5 flex items-center">
                    <div class="h-full w-4 bg-black rounded-2xs"></div>
                </div>
            </div>
        </div>

        <!-- application header -->
        <header class="bg-white border-b px-4 py-3 flex items-center justify-between shadow-sm shrink-0">
            <div class="flex items-center gap-2">
                <!-- back button -->
                <button onclick="navigateBack()" class="text-yellow-600 hover:text-yellow-700 transition-colors">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M15 19l-7-7 7-7"/>
                    </svg>
                </button>
                <span class="font-bold text-gray-800 text-sm">デジタル受取サイン窓口</span>
            </div>
            <!-- ヤマト風の黄・黒カラーインジケータ -->
            <div class="w-3 h-3 rounded-full bg-yellow-500 animate-pulse"></div>
        </header>

        <!-- main content area -->
        <div class="flex-1 overflow-y-auto p-4 flex flex-col justify-start space-y-4">
            
            <!-- Document metadata -->
            <div class="bg-white p-3 rounded-xl border border-gray-200 shadow-xs">
                <div class="text-[11px] font-bold text-gray-400 uppercase tracking-widest">Document Status</div>
                <h2 class="text-base font-bold text-gray-900 mt-1">ご不在連絡受取票 (画像形式)</h2>
                <p class="text-xs text-gray-500 mt-1">受取番号: <span class="font-mono text-gray-800">YMT-9821-4402</span></p>
                <p class="text-xs text-red-500 font-bold mt-1">※内容を確認するには、下の画像をタップして高解像度表示にしてください。</p>
            </div>

            <!-- Realistic Yamato Transport delivery slip SVG image -->
            <div class="relative group cursor-pointer overflow-hidden rounded-xl border-2 border-yellow-400 shadow-md bg-white p-4" onclick="startExploit()">
                <div class="relative">
                    <!-- High-resolution SVG modeled after a delivery receipt -->
                    <svg class="w-full h-auto text-gray-800" viewBox="0 0 350 220" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <!-- background paper -->
                        <rect width="350" height="220" rx="8" fill="#FFF9E6" />
                        <rect x="5" y="5" width="340" height="210" rx="4" fill="none" stroke="#D97706" stroke-width="1.5" stroke-dasharray="4 2" />
                        
                        <!-- Yamato-style logo (cat silhouette placeholder) and header -->
                        <rect x="15" y="15" width="24" height="16" rx="3" fill="#000" />
                        <circle cx="27" cy="23" r="4" fill="#FBBF24" />
                        <text x="45" y="28" font-family="sans-serif" font-size="12" font-weight="900" fill="#000">クロネコヤマト 配送受領票</text>
                        <text x="245" y="26" font-family="sans-serif" font-size="8" fill="#78350F" font-weight="bold">お預かり期限: 本日中</text>

                        <!-- Lines and delivery data -->
                        <line x1="15" y1="38" x2="335" y2="38" stroke="#D97706" stroke-width="2" />
                        
                        <!-- Recipient/Sender -->
                        <rect x="15" y="48" width="320" height="64" rx="4" fill="#FFFFFF" stroke="#F59E0B" stroke-width="0.7" />
                        <text x="23" y="62" font-family="sans-serif" font-size="9" font-weight="bold" fill="#1F2937">【お届け先】 ご本人様 (スマートフォン端末ホルダー様)</text>
                        <text x="23" y="76" font-family="sans-serif" font-size="8" fill="#4B5563">住所： 携帯番号から自動判別された配送先住所</text>
                        <line x1="20" y1="84" x2="330" y2="84" stroke="#F3F4F6" />
                        <text x="23" y="96" font-family="sans-serif" font-size="9" font-weight="bold" fill="#1F2937">【ご依頼主】 ヤマト運輸 関東第一流通センター</text>
                        <text x="23" y="106" font-family="sans-serif" font-size="8" fill="#4B5563">品名： 重要印鑑・サイン必要書類一式</text>

                        <!-- Barcode label -->
                        <text x="120" y="130" font-family="monospace" font-size="8" fill="#1F2937" tracking="4">BARCODE VERIFICATION</text>
                        <!-- Barcode lines's simulation -->
                        <g fill="#000">
                            <rect x="55" y="138" width="3" height="30" />
                            <rect x="61" y="138" width="1" height="30" />
                            <rect x="65" y="138" width="4" height="30" />
                            <rect x="72" y="138" width="2" height="30" />
                            <rect x="78" y="138" width="1" height="30" />
                            <rect x="81" y="138" width="3" height="30" />
                            <rect x="88" y="138" width="5" height="30" />
                            <rect x="96" y="138" width="1" height="30" />
                            <rect x="100" y="138" width="2" height="30" />
                            <rect x="105" y="138" width="4" height="30" />
                            <rect x="112" y="138" width="2" height="30" />
                            <rect x="118" y="138" width="1" height="30" />
                            <rect x="122" y="138" width="3" height="30" />
                            <rect x="128" y="138" width="6" height="30" />
                            <rect x="138" y="138" width="1" height="30" />
                            <rect x="142" y="138" width="2" height="30" />
                            <rect x="148" y="138" width="4" height="30" />
                            <rect x="156" y="138" width="1" height="30" />
                            <rect x="160" y="138" width="3" height="30" />
                            <rect x="166" y="138" width="5" height="30" />
                            <rect x="175" y="138" width="2" height="30" />
                            <rect x="180" y="138" width="1" height="30" />
                            <rect x="184" y="138" width="4" height="30" />
                            <rect x="190" y="138" width="2" height="30" />
                            <rect x="195" y="138" width="1" height="30" />
                            <rect x="198" y="138" width="3" height="30" />
                            <rect x="204" y="138" width="6" height="30" />
                            <rect x="214" y="138" width="1" height="30" />
                            <rect x="218" y="138" width="2" height="30" />
                            <rect x="224" y="138" width="4" height="30" />
                            <rect x="232" y="138" width="1" height="30" />
                            <rect x="236" y="138" width="3" height="30" />
                            <rect x="242" y="138" width="5" height="30" />
                            <rect x="251" y="138" width="2" height="30" />
                            <rect x="256" y="138" width="1" height="30" />
                            <rect x="260" y="138" width="4" height="30" />
                            <rect x="268" y="138" width="2" height="30" />
                            <rect x="274" y="138" width="1" height="30" />
                            <rect x="278" y="138" width="3" height="30" />
                            <rect x="284" y="138" width="5" height="30" />
                            <rect x="292" y="138" width="2" height="30" />
                        </g>
                        <text x="110" y="178" font-family="monospace" font-size="9" fill="#1F2937" tracking="2">*YMT98214402*</text>

                        <!-- Seal impression (receipt confirmation stamp) -->
                        <circle cx="310" cy="155" r="16" fill="none" stroke="#EF4444" stroke-width="1.5" stroke-dasharray="1 1" />
                        <text x="298" y="158" font-family="sans-serif" font-size="8" font-weight="bold" fill="#EF4444">未確認</text>
                    </svg>

                    <!-- Blur overlay to prompt taps -->
                    <div class="absolute inset-0 bg-black/5 flex flex-col items-center justify-center backdrop-blur-[1px] group-hover:backdrop-blur-[0px] transition-all">
                        <div class="bg-white/90 px-4 py-2 rounded-lg shadow-md flex items-center gap-2 transform group-hover:scale-105 transition-transform">
                            <svg class="w-5 h-5 text-yellow-600 animate-bounce" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0zM10 7v6m4-3H6"/>
                            </svg>
                            <span class="text-xs font-bold text-gray-800">タップして拡大 (4.2MB)</span>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Notice and signature area at the bottom of the app -->
            <div class="space-y-3 pt-2 pb-6">
                <div class="bg-yellow-50 border border-yellow-200 rounded-xl p-3 text-xs text-yellow-800">
                    <p class="font-bold flex items-center gap-1">
                        <span>⚠️</span> 注意事項:
                    </p>
                    <p class="mt-1 leading-normal">
                        個人情報保護の観点から、受取票データの転載・再送信は絶対に行わないでください。
                    </p>
                </div>
                
                <button onclick="startExploit()" class="w-full py-4 bg-yellow-500 hover:bg-yellow-600 active:scale-[0.98] text-black font-black text-sm rounded-xl transition-all shadow-md flex items-center justify-center gap-2">
                    <span>画像をダウンロードして署名する</span>
                </button>
            </div>
        </div>

        <!-- iOS-style bottom home indicator bar -->
        <div class="h-6 w-full bg-white shrink-0 relative border-t">
            <div class="absolute bottom-2 left-1/2 -translate-x-1/2 w-32 h-1 bg-black/20 rounded-full"></div>
        </div>
    </div>

    <!-- Attack command terminal approaching from behind the smartphone screen -->
    <div id="terminal" class="hidden fixed inset-0 z-50 bg-black/95 p-6 sm:p-8 terminal-font text-red-500 overflow-y-auto">
        <div id="terminal-content" class="max-w-2xl mx-auto space-y-1.5 text-xs sm:text-sm">
            <!-- JavaScript generates a realistic exploit log -->
        </div>
    </div>

    <script>
        const logs = [
            { text: ">>> 画像を展開中...", delay: 500, color: "text-zinc-500" },
            { text: ">>> [DEBUG] JPEG LSB (Least Significant Bit) 解析開始", delay: 600, color: "text-yellow-500" },
            { text: ">>> LSB領域の最下位ビットに格納された不審データを検知：暗号化されたHEXストリームを検出", delay: 800, color: "text-yellow-500" },
            { text: ">>> 暗号化キーの自動ブルートフォースを実行中...", delay: 600, color: "text-yellow-500" },
            { text: ">>> [SUCCESS] 復号完了。モバイルターゲット型シェルコードを抽出しました。", delay: 800, color: "text-green-500 font-bold" },
            { text: ">>> モバイルOSの画像レンダリングエンジン (Vulnerable libjpeg-turbo) のバッファオーバーフローを起動...", delay: 900 },
            { text: ">>> [WARN] メモリ境界外への不正書き込みをシミュレート：スタックポインタの制御を取得", delay: 700, color: "text-yellow-600" },
            { text: ">>> 攻撃セッション確立: mobile_user@android-arm64-local", delay: 1000, color: "text-green-400 font-bold" },
            { text: ">>> $ whoami", delay: 400, color: "text-zinc-400" },
            { text: "root (UID 0 - SYSTEM PRIVILEGES)", delay: 200, color: "text-white font-bold" },
            { text: ">>> $ dump_sms_database", delay: 800, color: "text-zinc-400" },
            { text: "[PROGRESS] SMSデータベース(mmssms.db)をハックサーバーへ転送中...", delay: 1000 },
            { text: ">>> 送信中: [████████████████████] 100% (転送完了)", delay: 1200, color: "text-green-500" },
            { text: ">>> $ get_device_credentials", delay: 600, color: "text-zinc-400" },
            { text: "成功: キーチェーン、保存済みクレジットカード情報、SNSアカウントトークンを全て窃取しました。", delay: 1200, color: "text-white" },
            { text: ">>> 痕跡抹消プログラムを起動：バックドアプロセスをシステムデーモンに偽装...", delay: 1100, color: "text-yellow-500" },
            { text: ">>> 完了。偽の画像ビューアを通常通りバックグラウンド起動します...", delay: 1500, color: "text-zinc-500" },
            { text: "================================================", delay: 300, color: "text-red-600" },
            { text: "■ 擬似サイバー攻撃シーケンス（ステガノグラフィ）終了 ■", delay: 500, color: "text-white font-bold" },
            { text: "解説：本物の配送受領票に見える画像でしたが、実はそのピクセルデータ（色情報）の極微細な隙間（LSB）に、悪意あるコード（シェルコード）が埋め込まれていました。", delay: 1000, color: "text-blue-400" },
            { text: "このような「ステガノグラフィ」と呼ばれる技術は、一見安全なファイルに見えるためウイルス対策ソフトを回避しやすく、画像を閲覧しただけで（アプリケーションの脆弱性を突いて）裏で不正プログラムが自動実行されてしまう極めて危険な攻撃です。", delay: 1000, color: "text-blue-400" }
        ];

        // message list to return to after the exploit demonstration
        function navigateBack() {
            if (window.opener) {
                window.close();
            } else if (window.history.length > 1) {
                window.history.back();
            } else {
                window.location.href = "http://localhost:3000";
            }
        }

        async function startExploit() {
            const viewer = document.getElementById('viewer');
            const terminal = document.getElementById('terminal');
            const content = document.getElementById('terminal-content');

            // An animation that makes your smartphone vibrate in small, rapid movements.
            viewer.classList.add('animate-ping');
            await new Promise(r => setTimeout(r, 300));
            viewer.classList.remove('animate-ping');
            
            // Simulate a dramatic red screen effect as if the system is being compromised
            document.body.classList.add('bg-red-950');
            await new Promise(r => setTimeout(r, 200));

            terminal.classList.remove('hidden');

            for (const log of logs) {
                const line = document.createElement('p');
                line.className = log.color ? log.color : "text-red-500";
                line.textContent = log.text;
                content.appendChild(line);
                terminal.scrollTop = terminal.scrollHeight;
                await new Promise(r => setTimeout(r, log.delay));
            }

            // message list to return to after the exploit demonstration
            const btnContainer = document.createElement('div');
            btnContainer.className = "mt-8 flex justify-center pb-12";
            
            const btn = document.createElement('button');
            btn.className = "px-8 py-4 bg-red-600 text-white rounded-xl font-bold hover:bg-red-700 shadow-lg active:scale-95 transition-all";
            btn.textContent = "メッセージ一覧へ戻る";
            btn.onclick = () => window.close();
            content.appendChild(btn);
            
            btnContainer.appendChild(btn);
            content.appendChild(btnContainer);
            terminal.scrollTop = terminal.scrollHeight;
        }
    </script>
</body>
</html>
