<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smishing Simulator - Standalone</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @keyframes fade-in { from { opacity: 0; } to { opacity: 1; } }
        @keyframes slide-in-right { from { transform: translateX(20px); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
        .animate-fade-in { animation: fade-in 0.3s ease-out forwards; }
        .animate-slide-in { animation: slide-in-right 0.3s ease-out forwards; }
        .animate-pulse-fast { animation: pulse 1s cubic-bezier(0.4, 0, 0.6, 1) infinite; }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: .5; } }
        body { margin: 0; padding: 0; background-color: #111827; color: white; font-family: sans-serif; overflow: hidden; }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #1f2937; }
        ::-webkit-scrollbar-thumb { background: #4b5563; border-radius: 3px; }
    </style>
</head>
<body>

<div id="root" class="h-screen w-full flex flex-row">
    <div class="w-1/2 h-full flex flex-col p-8 border-r border-gray-800 bg-gray-800/30 overflow-y-auto">
        <div class="flex items-center justify-between mb-5 flex-shrink-0">
            <div class="flex items-center gap-2 text-white font-bold text-xl">
                <i data-lucide="smartphone" class="text-blue-400"></i>
                <span>あなたのスマートフォン</span>
            </div>
            <button onclick="resetScenario()" class="text-gray-400 hover:text-white transition-colors border border-gray-600 hover:border-gray-400 rounded-full px-4 py-2 text-sm flex items-center gap-2 bg-gray-800 hover:bg-gray-700">
                <i data-lucide="refresh-ccw" class="w-4 h-4"></i> 最初に戻る
            </button>
        </div>
        
        <div class="flex-1 flex flex-col items-center justify-start min-h-0 pb-8">
            <div class="relative w-[300px] h-[600px] bg-gray-50 rounded-[40px] shadow-2xl border-[8px] border-gray-800 overflow-hidden flex flex-col flex-shrink-0" id="mobile-container">
                <div id="mobile-content" class="flex-1 overflow-y-auto relative">
                    </div>
                <div class="absolute bottom-2 left-1/2 -translate-x-1/2 w-1/3 h-1 bg-gray-400/80 rounded-full z-[60]"></div>
            </div>
        </div>
    </div>

    <div class="w-1/2 h-full flex flex-col p-8 bg-gray-950">
        <div class="flex items-center gap-2 text-white font-bold text-xl mb-6 flex-shrink-0">
            <i data-lucide="shield-alert" class="text-red-500"></i>
            <span>攻撃者 C2サーバー (裏側の挙動)</span>
        </div>
        <div class="flex-1 bg-gray-950 rounded-xl border border-gray-800 shadow-2xl flex flex-col overflow-hidden font-mono text-sm">
            <div class="bg-gray-900 px-4 py-2 flex items-center gap-2 border-b border-gray-800">
                <i data-lucide="terminal" class="w-4 h-4 text-gray-400"></i>
                <span class="text-gray-400 font-bold">C2_SERVER_TERMINAL - root@kali:~</span>
            </div>
            <div id="terminal-logs" class="flex-1 p-4 overflow-y-auto space-y-1">
                </div>
        </div>
    </div>
</div>

<div id="outro-screen" class="fixed inset-0 bg-gray-950 z-[100] hidden overflow-y-auto p-8 animate-fade-in">
    </div>

<script>
    // 状態管理
    let state = {
        step: 2,
        email: '',
        password: '',
        logs: [
            { text: "C2 Server initialized. Listening on port 443...", type: "info" },
            { text: "[CONNECT] Target IP: 192.168.1.104 connected.", type: "info" },
            { text: "[SERVE] Serving fake Google OAuth login page (Phishing form)...", type: "info" }
        ]
    };

    // 初期化
    function init() {
        render();
        lucide.createIcons();
    }

    function getTime() {
        return new Date().toLocaleTimeString('en-US', { hour12: false });
    }

    function addLog(text, type = "info", delay = 0) {
        setTimeout(() => {
            state.logs.push({ text, type, time: getTime() });
            renderTerminal();
        }, delay);
    }

    function addInstantLog(text, type = "data") {
        state.logs.push({ text, type, time: getTime() });
        renderTerminal();
    }

    function resetScenario() {
        state.step = 2;
        state.email = '';
        state.password = '';
        state.logs = [
            { text: "C2 Server initialized. Listening on port 443...", type: "info" },
            { text: "[CONNECT] Target IP: 192.168.1.104 connected.", type: "info" },
            { text: "[SERVE] Serving fake Google OAuth login page (Phishing form)...", type: "info" }
        ];
        document.getElementById('outro-screen').classList.add('hidden');
        render();
    }

    // 描画エンジン
    function render() {
        const mobileContent = document.getElementById('mobile-content');
        mobileContent.innerHTML = '';

        if (state.step === 2) {
            mobileContent.innerHTML = `
                <div class="flex flex-col min-h-full bg-white animate-fade-in pb-6">
                    <div class="bg-gray-50 border-b p-4 text-center font-bold flex items-center justify-center gap-2 text-gray-800 shadow-sm">
                        <i data-lucide="message-circle" class="text-green-500"></i> SECRET TALK
                    </div>
                    <div class="p-6 flex flex-col">
                        <h3 class="text-lg font-bold text-gray-800 mb-4 text-center border-b pb-2">会員登録（無料）</h3>
                        <div class="bg-blue-50 border border-blue-100 rounded-md p-3 mb-6">
                            <p class="text-xs text-gray-600 text-center leading-relaxed">
                                本人確認およびサイト登録のため、お使いの<span class="font-bold text-blue-600">Googleアカウント</span>情報を入力してください。
                            </p>
                        </div>
                        <div class="flex flex-col gap-4">
                            <div>
                                <label class="text-sm font-bold text-gray-700 flex items-center gap-1 mb-1"><i data-lucide="user" class="w-3 h-3"></i> メールアドレス</label>
                                <input type="email" oninput="handleInput('email', this.value)" class="w-full border border-gray-300 rounded-md p-2 text-sm text-gray-800 focus:ring-2 focus:ring-blue-500 focus:outline-none" value="${state.email}">
                            </div>
                            <div>
                                <label class="text-sm font-bold text-gray-700 flex items-center gap-1 mb-1"><i data-lucide="lock" class="w-3 h-3"></i> パスワード</label>
                                <input type="password" oninput="handleInput('password', this.value)" class="w-full border border-gray-300 rounded-md p-2 text-sm text-gray-800 focus:ring-2 focus:ring-blue-500 focus:outline-none" value="${state.password}">
                            </div>
                            <button onclick="handleLoginSubmit()" class="bg-blue-600 text-white font-bold py-3 rounded-md mt-4 shadow hover:bg-blue-700 transition-all text-sm">
                                登録して次へ
                            </button>
                        </div>
                    </div>
                </div>
            `;
        } else if (state.step === 3) {
            mobileContent.innerHTML = `
                <div class="flex flex-col min-h-full bg-white animate-slide-in pb-6">
                    <div class="bg-gray-50 border-b p-4 text-center font-bold flex items-center justify-center gap-2 text-gray-800 shadow-sm">
                        <i data-lucide="message-circle" class="text-green-500"></i> SECRET TALK
                    </div>
                    <div class="p-6 flex flex-col items-center justify-center flex-1">
                        <div class="w-16 h-16 bg-green-100 text-green-600 rounded-full flex items-center justify-center mb-4">
                            <i data-lucide="check" class="w-8 h-8"></i>
                        </div>
                        <h3 class="text-xl font-bold text-gray-800 mb-2">登録完了！</h3>
                        <p class="text-sm text-gray-600 mb-8 text-center leading-relaxed">
                            アカウントの登録が完了しました。<br>
                            松本潤さんとのシークレットチャットを開始するには、専用アプリをダウンロードしてください。
                        </p>
                        <button onclick="handleDownloadClick()" class="bg-green-600 text-white font-bold py-4 px-4 rounded-xl w-full shadow-lg hover:bg-green-700 active:scale-95 transition-all flex items-center justify-center gap-2 whitespace-nowrap text-[15px]">
                            <i data-lucide="download" class="w-5 h-5"></i> <span>専用アプリをダウンロード</span>
                        </button>
                    </div>
                </div>
            `;
        } else if (state.step === 4 || state.step === 5) {
            // ステップ3の画面を維持しつつ、上に警告を出す
            mobileContent.innerHTML = `
                <div class="flex flex-col min-h-full bg-white pb-6 opacity-40">
                    <div class="bg-gray-50 border-b p-4 text-center font-bold flex items-center justify-center gap-2 text-gray-800 shadow-sm">
                        <i data-lucide="message-circle" class="text-green-500"></i> SECRET TALK
                    </div>
                    <div class="p-6 flex flex-col items-center justify-center flex-1 text-center">
                        <h3 class="text-xl font-bold text-gray-800">登録完了！</h3>
                    </div>
                </div>
                ${state.step === 4 ? `
                <div class="absolute inset-0 bg-black/60 flex items-center justify-center p-4 z-50 animate-fade-in">
                    <div class="bg-white rounded-xl p-5 w-full shadow-2xl flex flex-col gap-3">
                        <div class="flex items-center gap-2 text-red-600 mb-2"><i data-lucide="alert-triangle"></i><span class="font-bold">セキュリティの警告</span></div>
                        <p class="text-sm text-gray-800">お使いのデバイスは、提供元不明のアプリをインストールしようとしています。続行してもよろしいですか？</p>
                        <div class="flex justify-end gap-3 mt-4">
                            <button onclick="state.step=3; render();" class="text-sm font-bold text-gray-500 px-3 py-2">キャンセル</button>
                            <button onclick="handleAllowInstall()" class="text-sm font-bold text-blue-600 px-3 py-2">許可</button>
                        </div>
                    </div>
                </div>
                ` : `
                <div class="absolute inset-0 bg-red-600 flex flex-col items-center justify-center animate-fade-in p-6 pb-10 text-white text-center">
                    <i data-lucide="shield-alert" class="w-16 h-16 text-white mb-6 animate-pulse-fast"></i>
                    <h3 class="text-2xl font-black mb-4 tracking-wider">あなたはウイルスに<br>感染しました</h3>
                    <div class="bg-black/30 rounded-xl p-4 w-full text-left backdrop-blur-sm border border-white/20">
                        <p class="text-sm font-bold text-red-200 mb-2">【現在起きていること】</p>
                        <ul class="text-sm space-y-2 list-disc list-inside">
                            <li>連絡先の全データ取得中...</li>
                            <li>SMS履歴の抽出中...</li>
                            <li>C2サーバーへのデータ送信中...</li>
                        </ul>
                    </div>
                    <button onclick="showOutro()" class="mt-8 bg-white text-red-600 hover:bg-gray-100 font-bold py-3 px-8 rounded-full shadow-lg transition-transform hover:scale-105 flex items-center gap-2">
                        <i data-lucide="book-open"></i> 解説を見る
                    </button>
                </div>
                `}
            `;
        }

        renderTerminal();
        lucide.createIcons();
    }

    function renderTerminal() {
        const terminalLogs = document.getElementById('terminal-logs');
        terminalLogs.innerHTML = '';
        state.logs.forEach(log => {
            let color = "text-gray-300";
            if (log.type === "warning") color = "text-yellow-400";
            if (log.type === "success") color = "text-red-500 font-bold";
            if (log.type === "data") color = "text-green-400";

            const div = document.createElement('div');
            div.className = `${color} leading-tight flex`;
            div.innerHTML = `
                <span class="text-gray-600 mr-2 flex-shrink-0">[${log.time || '00:00:00'}]</span>
                <span class="whitespace-pre-wrap">${log.text}</span>
            `;
            terminalLogs.appendChild(div);
        });
        terminalLogs.scrollTop = terminalLogs.scrollHeight;
    }

    // イベントハンドラ
    function handleInput(type, value) {
        state[type] = value;
        if (value.length > 0) {
            addInstantLog(`[KEYLOG - ${type.toUpperCase()}] ${value}`, "warning");
        }
    }

    function handleLoginSubmit() {
        if (!state.email || !state.password) return;
        state.step = 3;
        addLog(`[SUCCESS] アカウント情報の窃取に成功しました！`, "success", 100);
        addLog(` -> 入力されたメールアドレス: ${state.email}`, "success", 200);
        addLog(` -> 入力されたパスワード: ${state.password}`, "success", 300);
        addLog(`[SERVE] ターゲットを不正アプリのダウンロードページへ誘導中...`, "info", 1200);
        render();
    }

    function handleDownloadClick() {
        state.step = 4;
        addLog("[ACTION] Target clicked 'Download App'.", "warning", 200);
        addLog("[PAYLOAD] Generating dynamic malicious APK (Fake Chat App)...", "info", 800);
        addLog("[PAYLOAD] Sending payload to target device...", "info", 1500);
        render();
    }

    function handleAllowInstall() {
        state.step = 5;
        addLog("[CRITICAL] Target granted OS installation permissions!", "success", 300);
        addLog("[EXEC] Malware executed successfully. Elevating privileges...", "warning", 2000);
        addLog("========== 連絡先の全データ取得を開始 ==========", "warning", 4000);
        addLog("[DATA] Extracting Contacts... Found 142 entries.", "success", 5500);
        addLog(" -> Uploaded: 母 (090-XXXX-XXXX)", "data", 5800);
        addLog(" -> Uploaded: 父 (090-XXXX-XXXX)", "data", 6000);
        addLog(" -> Uploaded: 兄 (090-XXXX-XXXX)", "data", 6200);
        addLog(" -> Uploaded: 外崎君 (080-XXXX-XXXX)", "data", 6400);
        addLog(" -> Uploaded: 井上先輩 (080-XXXX-XXXX)", "data", 6600);
        addLog(" -> Uploaded: 寺田先生 (070-XXXX-XXXX)", "data", 6800);
        addLog("========== SMS履歴から認証コードの抽出を開始 ==========", "warning", 8000);
        addLog("[EXFILTRATE] Scanning for cached 2FA / OTP codes...", "info", 8500);
        addLog("[CRITICAL] Intercepted SMS: 'Google確認コード: 492011'", "success", 9500);
        addLog("[CRITICAL] Intercepted SMS: '三井住友銀行: ワンタイムパスワード 8821'", "success", 10200);
        addLog("[CRITICAL] Intercepted SMS: 'PayPay: 認証コード 59281'", "success", 10900);
        addLog("[CRITICAL] Intercepted SMS: 'Amazon: セキュリティコード 391029'", "success", 11600);
        addLog("========== 端末の完全な乗っ取りが完了 ==========", "success", 13000);
        render();
    }

    function showOutro() {
        const outro = document.getElementById('outro-screen');
        outro.classList.remove('hidden');
        outro.innerHTML = `
            <div class="min-h-full flex flex-col items-center justify-center py-12">
                <i data-lucide="book-open" class="w-16 h-16 text-green-500 mb-4"></i>
                <h1 class="text-3xl font-black text-green-400 mb-8 text-center">体験終了 - 解説</h1>
                <div class="max-w-3xl w-full space-y-6 text-left">
                    <div class="bg-gray-900 p-6 rounded-xl border border-gray-800">
                        <h2 class="text-xl font-bold text-red-400 mb-3 border-b border-gray-800 pb-2">1. リアルタイム・キーロガーの恐怖</h2>
                        <p class="text-gray-300 leading-relaxed">ログイン画面での入力情報は、送信ボタンを押す前から1文字入力するごとに情報が攻撃者へ送られています。</p>
                    </div>
                    <div class="bg-gray-900 p-6 rounded-xl border border-gray-800">
                        <h2 class="text-xl font-bold text-red-400 mb-3 border-b border-gray-800 pb-2">2. マルウェアによる端末内の情報窃取</h2>
                        <p class="text-gray-300 leading-relaxed">”専用アプリ”の正体はウイルスです。一度インストールを許可すると、電話帳の連絡先やSMS履歴がすべて傍受されてしまいます。</p>
                    </div>
                    <div class="bg-gray-900 p-6 rounded-xl border border-gray-800">
                        <h2 class="text-xl font-bold text-red-400 mb-3 border-b border-gray-800 pb-2">3. 周囲を巻き込む”二次被害”</h2>
                        <p class="text-gray-300 leading-relaxed">あなたがウイルスに感染することで、自分だけでなく家族や友人の情報まで流出し、あなたが加害者の拡散源になってしまう危険があります。</p>
                    </div>

                    <div class="bg-blue-900/30 p-6 rounded-xl border border-blue-800/50 mt-8">
                        <h2 class="text-xl font-bold text-blue-400 mb-3 flex items-center gap-2">
                            <i data-lucide="shield-alert" class="w-5 h-5"></i> 対策 ～被害を防ぐためには～
                        </h2>
                        <ul class="list-disc list-inside text-gray-300 space-y-2 leading-relaxed">
                            <li>身に覚えのないSMSのリンクは絶対に開かない。</li>
                            <li>ログイン画面が出てもすぐに入力せず、必ず公式アプリや自分で検索した公式サイトからアクセスし直す。</li>
                            <li>アプリは必ず正規のストア（App Store, Google Play等）からのみインストールし、「提供元不明のアプリ」は許可しない。</li>
                        </ul>
                    </div>
                </div>
                <div class="mt-10 flex flex-col sm:flex-row items-center justify-center gap-4">
                    <button onclick="resetScenario()" class="bg-gray-800 hover:bg-gray-700 text-white font-bold py-3 px-8 rounded-full shadow-lg transition-all flex items-center gap-2">
                        <i data-lucide="refresh-ccw"></i> 最初からやり直す
                    </button>
                    <button onclick="window.location.href='http://localhost:3000/'" class="bg-blue-600 hover:bg-blue-500 text-white font-bold py-3 px-8 rounded-full shadow-lg transition-all flex items-center gap-2">
                        <i data-lucide="message-square"></i> メッセージ一覧に戻る
                    </button>
                </div>
            </div>
        `;
        lucide.createIcons();
    }

    // 開始
    init();
</script>

</body>
</html>
